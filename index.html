<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Document Studio</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- PDF.js for rendering and text extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  
  <!-- PDF-Lib for modifying and saving PDFs -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* PDF Page Styling */
    .pdf-page-container {
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 4px;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .text-overlay-item {
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
      line-height: 1.0;
      border-radius: 2px;
    }

    .text-overlay-item:hover {
      background-color: rgba(37, 99, 235, 0.12);
      outline: 1px dashed rgba(37, 99, 235, 0.5);
    }

    .custom-annotation {
      position: absolute;
      user-select: none;
      cursor: move;
    }

    .custom-text-box {
      position: absolute;
      outline: none;
      min-width: 24px;
      padding: 2px 4px;
      line-height: 1.2;
      word-break: break-word;
      border: 1px dashed transparent;
      border-radius: 2px;
    }

    .custom-text-box:focus, .custom-text-box.selected {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25);
    }

    .color-swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s ease;
    }
    .color-swatch:hover {
      transform: scale(1.15);
    }
    .color-swatch.active {
      border-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.8);
    }

    /* Subtle Glassmorphism Navbar */
    .nav-blur {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="h-full flex flex-col overflow-hidden font-sans bg-slate-950 text-slate-100 antialiased selection:bg-brand-500 selection:text-white">

  <!-- TOP APP BAR -->
  <header class="bg-slate-950 border-b border-slate-800/80 px-6 py-3 flex items-center justify-between shrink-0 z-30 shadow-sm">
    <!-- Brand Title -->
    <div class="flex items-center space-x-3.5">
      <div class="bg-gradient-to-tr from-brand-700 to-brand-500 text-white w-9 h-9 rounded-lg shadow-md flex items-center justify-center font-semibold">
        <i class="fa-solid fa-file-contract text-base"></i>
      </div>
      <div>
        <h1 class="font-bold text-slate-100 text-sm tracking-tight flex items-center gap-2">
          Document Studio
          <span class="text-[10px] bg-slate-800 text-slate-300 border border-slate-700/60 px-2 py-0.5 rounded font-medium uppercase tracking-wider">Pro</span>
        </h1>
        <p class="text-[11px] text-slate-400 font-medium" id="file-info">Ready for document</p>
      </div>
    </div>

    <!-- Central Navigation & Actions -->
    <div class="flex items-center space-x-3">
      <input type="file" id="pdf-file-input" accept="application/pdf" class="hidden" />
      
      <button id="btn-open-file" class="bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs px-3.5 py-2 rounded-lg font-medium border border-slate-800 transition-all flex items-center gap-2 shadow-sm">
        <i class="fa-solid fa-arrow-up-from-bracket text-slate-400"></i> Open PDF
      </button>

      <button id="btn-sample-pdf" class="bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs px-3.5 py-2 rounded-lg font-medium border border-slate-800 transition-all flex items-center gap-2 shadow-sm">
        <i class="fa-solid fa-file-lines text-brand-500"></i> Load Sample
      </button>

      <div class="h-4 w-px bg-slate-800 my-auto mx-1"></div>

      <button id="btn-export-pdf" disabled class="bg-brand-600 hover:bg-brand-500 disabled:opacity-30 disabled:hover:bg-brand-600 disabled:cursor-not-allowed text-white text-xs px-4 py-2 rounded-lg font-medium shadow-md shadow-brand-900/20 transition-all flex items-center gap-2">
        <i class="fa-solid fa-download"></i> Export PDF
      </button>
    </div>
  </header>

  <!-- CONTROL TOOLBAR (CENTERED & SLEEK) -->
  <div class="nav-blur border-b border-slate-800/80 px-6 py-2.5 flex flex-wrap items-center justify-between gap-4 shrink-0 z-20">
    
    <!-- Left: Tool Selector -->
    <div class="flex items-center space-x-1 bg-slate-900/90 p-1 rounded-xl border border-slate-800/80 shadow-inner">
      <button data-tool="select" class="tool-btn active bg-brand-600 text-white px-3.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition-all">
        <i class="fa-solid fa-arrow-pointer text-xs"></i> Select
      </button>
      <button data-tool="edit-text" class="tool-btn text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 px-3.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition-all" title="Edit original PDF text directly">
        <i class="fa-solid fa-pen-to-square text-xs text-brand-400"></i> Edit Text
      </button>
      <button data-tool="add-text" class="tool-btn text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 px-3.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition-all" title="Add custom text block">
        <i class="fa-solid fa-font text-xs text-emerald-400"></i> Add Text
      </button>
      <button data-tool="whiteout" class="tool-btn text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 px-3.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition-all" title="Cover/redact sections">
        <i class="fa-solid fa-eraser text-xs text-rose-400"></i> Whiteout
      </button>
      <button data-tool="highlight" class="tool-btn text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 px-3.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition-all" title="Highlight text">
        <i class="fa-solid fa-highlighter text-xs text-amber-400"></i> Highlight
      </button>
      <button data-tool="draw" class="tool-btn text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 px-3.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition-all" title="Signature or freehand drawing">
        <i class="fa-solid fa-signature text-xs text-sky-400"></i> Draw
      </button>
    </div>

    <!-- Center: Formatting Controls -->
    <div id="formatting-toolbar" class="flex items-center space-x-3 bg-slate-900/90 px-3.5 py-1 rounded-xl border border-slate-800/80 text-xs">
      <div class="flex items-center space-x-2">
        <span class="text-slate-400 text-[11px] font-medium">Font</span>
        <select id="font-family-select" class="bg-slate-800 text-slate-200 border border-slate-700/80 rounded-lg px-2.5 py-1 outline-none focus:border-brand-500 font-sans text-xs">
          <option value="Helvetica">Helvetica</option>
          <option value="Times-Roman">Times Roman</option>
          <option value="Courier">Courier</option>
        </select>
      </div>

      <div class="h-4 w-px bg-slate-800"></div>

      <div class="flex items-center space-x-2">
        <span class="text-slate-400 text-[11px] font-medium">Size</span>
        <input type="number" id="font-size-input" min="6" max="120" value="14" class="w-12 bg-slate-800 text-slate-200 border border-slate-700/80 rounded-lg px-2 py-1 outline-none focus:border-brand-500 text-center text-xs font-medium" />
      </div>

      <div class="h-4 w-px bg-slate-800"></div>

      <div class="flex items-center space-x-2">
        <span class="text-slate-400 text-[11px] font-medium">Color</span>
        <div class="flex items-center space-x-1.5" id="color-palette">
          <div class="color-swatch active bg-slate-950 border" data-color="#000000" title="Black"></div>
          <div class="color-swatch bg-blue-600" data-color="#2563eb" title="Blue"></div>
          <div class="color-swatch bg-red-600" data-color="#dc2626" title="Red"></div>
          <div class="color-swatch bg-emerald-600" data-color="#059669" title="Green"></div>
        </div>
        <input type="color" id="custom-color-picker" value="#000000" class="w-5 h-5 rounded cursor-pointer bg-transparent border-0 p-0" title="Custom color" />
      </div>

      <button id="btn-delete-element" class="hidden bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2.5 py-1 rounded-lg transition-all flex items-center gap-1 font-medium text-xs">
        <i class="fa-solid fa-trash-can text-[10px]"></i> Delete
      </button>
    </div>

    <!-- Right: Zoom & Navigation -->
    <div class="flex items-center space-x-2 bg-slate-900/90 px-3.5 py-1 rounded-xl border border-slate-800/80 text-xs">
      <button id="btn-prev-page" class="text-slate-400 hover:text-slate-100 p-1 transition-all">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <span class="text-slate-300 font-medium px-1">
        <span id="current-page-num" class="text-slate-100 font-bold">0</span> / <span id="total-pages-num" class="text-slate-400">0</span>
      </span>
      <button id="btn-next-page" class="text-slate-400 hover:text-slate-100 p-1 transition-all">
        <i class="fa-solid fa-chevron-right"></i>
      </button>

      <div class="h-4 w-px bg-slate-800"></div>

      <button id="btn-zoom-out" class="text-slate-400 hover:text-slate-100 p-1 transition-all" title="Zoom Out">
        <i class="fa-solid fa-minus text-[10px]"></i>
      </button>
      <span id="zoom-percentage" class="text-slate-300 font-medium w-12 text-center text-xs">100%</span>
      <button id="btn-zoom-in" class="text-slate-400 hover:text-slate-100 p-1 transition-all" title="Zoom In">
        <i class="fa-solid fa-plus text-[10px]"></i>
      </button>
    </div>

  </div>

  <!-- WORKSPACE -->
  <div class="flex-1 flex overflow-hidden relative">
    
    <!-- LEFT SIDEBAR: Page Thumbnails -->
    <aside id="thumbnails-sidebar" class="w-60 bg-slate-950 border-r border-slate-800/80 flex flex-col shrink-0 hidden lg:flex">
      <div class="p-3.5 border-b border-slate-800/80 text-[11px] font-semibold text-slate-400 uppercase tracking-wider flex justify-between items-center">
        <span>Pages</span>
        <i class="fa-solid fa-layer-group text-slate-500"></i>
      </div>
      <div id="thumbnails-container" class="flex-1 overflow-y-auto p-3.5 space-y-4">
        <div class="text-center py-12 text-xs text-slate-500 font-medium">No document loaded</div>
      </div>
    </aside>

    <!-- CENTER EDITOR VIEWPORT (CENTERED CANVAS) -->
    <main id="editor-viewport" class="flex-1 overflow-auto p-8 bg-slate-900/60 relative flex items-start justify-center min-h-0">
      
      <!-- EMPTY STATE -->
      <div id="empty-state" class="my-auto text-center p-10 max-w-md border border-slate-800 rounded-2xl bg-slate-950/70 shadow-2xl backdrop-blur">
        <div class="w-14 h-14 bg-brand-500/10 text-brand-500 border border-brand-500/20 rounded-2xl flex items-center justify-center mx-auto mb-5 text-xl shadow-inner">
          <i class="fa-solid fa-file-pdf"></i>
        </div>
        <h2 class="text-base font-semibold text-slate-100 mb-2">Upload a PDF to get started</h2>
        <p class="text-xs text-slate-400 mb-6 leading-relaxed">
          Edit existing text, place new annotations, add whiteouts, or draw freehand directly in your browser.
        </p>
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
          <button onclick="document.getElementById('pdf-file-input').click()" class="w-full sm:w-auto bg-brand-600 hover:bg-brand-500 text-white font-medium text-xs px-4 py-2.5 rounded-lg shadow-md transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-upload"></i> Upload File
          </button>
          <button onclick="loadSamplePDF()" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 border border-slate-700/80 text-slate-200 font-medium text-xs px-4 py-2.5 rounded-lg transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-file-contract text-brand-400"></i> Demo Document
          </button>
        </div>
      </div>

      <!-- MAIN PAGE RENDERER CONTAINER -->
      <div id="page-render-wrapper" class="hidden relative my-auto">
        <!-- Canvas page rendered here -->
      </div>

    </main>

  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 border border-slate-700/80 text-slate-200 text-xs px-4 py-3 rounded-xl shadow-2xl transition-all transform translate-y-20 opacity-0 flex items-center gap-3 z-50">
    <i id="toast-icon" class="fa-solid fa-circle-info text-brand-400 text-sm"></i>
    <span id="toast-msg" class="font-medium">Notification message</span>
  </div>

  <!-- APPLICATION LOGIC -->
  <script>
    // --- APP STATE ---
    let rawPdfBytes = null;
    let pdfjsDoc = null;
    let pdfLibDoc = null;
    let currentPageIndex = 1;
    let totalPages = 0;
    let currentZoom = 1.0;
    let activeTool = 'select';
    
    let currentFontFamily = 'Helvetica';
    let currentFontSize = 14;
    let currentTextColor = '#000000';

    const pageAnnotations = {};
    let activeSelectedElement = null;
    let isDrawing = false;

    // --- DOM ELEMENTS ---
    const fileInput = document.getElementById('pdf-file-input');
    const btnOpenFile = document.getElementById('btn-open-file');
    const btnSamplePdf = document.getElementById('btn-sample-pdf');
    const btnExportPdf = document.getElementById('btn-export-pdf');
    const emptyState = document.getElementById('empty-state');
    const pageWrapper = document.getElementById('page-render-wrapper');
    const fileInfo = document.getElementById('file-info');
    const thumbnailsContainer = document.getElementById('thumbnails-container');

    const currentPageNumEl = document.getElementById('current-page-num');
    const totalPagesNumEl = document.getElementById('total-pages-num');
    const zoomPercentageEl = document.getElementById('zoom-percentage');

    const btnPrevPage = document.getElementById('btn-prev-page');
    const btnNextPage = document.getElementById('btn-next-page');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');

    const toolButtons = document.querySelectorAll('.tool-btn');
    const fontFamilySelect = document.getElementById('font-family-select');
    const fontSizeInput = document.getElementById('font-size-input');
    const colorSwatches = document.querySelectorAll('.color-swatch');
    const customColorPicker = document.getElementById('custom-color-picker');
    const btnDeleteElement = document.getElementById('btn-delete-element');

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      setupEventListeners();
    });

    function setupEventListeners() {
      btnOpenFile.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', handleFileSelect);
      btnSamplePdf.addEventListener('click', loadSamplePDF);
      btnExportPdf.addEventListener('click', exportModifiedPDF);

      btnPrevPage.addEventListener('click', () => changePage(-1));
      btnNextPage.addEventListener('click', () => changePage(1));

      btnZoomIn.addEventListener('click', () => setZoom(currentZoom + 0.15));
      btnZoomOut.addEventListener('click', () => setZoom(currentZoom - 0.15));

      toolButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          toolButtons.forEach(b => {
            b.classList.remove('active', 'bg-brand-600', 'text-white');
            b.classList.add('text-slate-400');
          });
          btn.classList.add('active', 'bg-brand-600', 'text-white');
          btn.classList.remove('text-slate-400');
          
          activeTool = btn.getAttribute('data-tool');
          showToast(`Active tool: ${btn.textContent.trim()}`, 'info');
        });
      });

      fontFamilySelect.addEventListener('change', (e) => {
        currentFontFamily = e.target.value;
        if (activeSelectedElement && activeSelectedElement.dataset.type === 'add-text') {
          activeSelectedElement.style.fontFamily = getCssFontFamily(currentFontFamily);
          updateElementAnnotationData(activeSelectedElement);
        }
      });

      fontSizeInput.addEventListener('input', (e) => {
        currentFontSize = parseInt(e.target.value) || 14;
        if (activeSelectedElement && activeSelectedElement.dataset.type === 'add-text') {
          activeSelectedElement.style.fontSize = `${currentFontSize}px`;
          updateElementAnnotationData(activeSelectedElement);
        }
      });

      colorSwatches.forEach(swatch => {
        swatch.addEventListener('click', () => {
          colorSwatches.forEach(s => s.classList.remove('active'));
          swatch.classList.add('active');
          currentTextColor = swatch.getAttribute('data-color');
          applyColorToSelected();
        });
      });

      customColorPicker.addEventListener('input', (e) => {
        currentTextColor = e.target.value;
        colorSwatches.forEach(s => s.classList.remove('active'));
        applyColorToSelected();
      });

      btnDeleteElement.addEventListener('click', deleteSelectedElement);
    }

    function applyColorToSelected() {
      if (activeSelectedElement && activeSelectedElement.dataset.type === 'add-text') {
        activeSelectedElement.style.color = currentTextColor;
        updateElementAnnotationData(activeSelectedElement);
      }
    }

    // --- PDF LOADING ---
    async function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file || file.type !== 'application/pdf') {
        showToast('Please select a valid PDF document.', 'error');
        return;
      }

      fileInfo.textContent = `${file.name}`;
      const arrayBuffer = await file.arrayBuffer();
      loadPDFBytes(arrayBuffer);
    }

    async function loadPDFBytes(arrayBuffer) {
      try {
        showToast('Loading document...', 'info');
        rawPdfBytes = arrayBuffer;

        Object.keys(pageAnnotations).forEach(k => delete pageAnnotations[k]);
        currentPageIndex = 1;

        pdfjsDoc = await pdfjsLib.getDocument({ data: rawPdfBytes.slice(0) }).promise;
        totalPages = pdfjsDoc.numPages;

        pdfLibDoc = await PDFLib.PDFDocument.load(rawPdfBytes.slice(0));

        emptyState.classList.add('hidden');
        pageWrapper.classList.remove('hidden');
        btnExportPdf.disabled = false;

        totalPagesNumEl.textContent = totalPages;

        await renderThumbnails();
        await renderCurrentPage();

        showToast('Document loaded successfully', 'success');
      } catch (err) {
        console.error(err);
        showToast('Failed to load PDF document.', 'error');
      }
    }

    // --- THUMBNAILS RENDERER ---
    async function renderThumbnails() {
      thumbnailsContainer.innerHTML = '';
      for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
        const page = await pdfjsDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: 0.18 });

        const thumbWrapper = document.createElement('div');
        thumbWrapper.className = `cursor-pointer rounded-lg border p-1 transition-all flex flex-col items-center bg-slate-900 ${
          pageNum === currentPageIndex ? 'border-brand-500 shadow-lg shadow-brand-500/10' : 'border-slate-800 hover:border-slate-700'
        }`;
        thumbWrapper.dataset.pageNum = pageNum;

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.className = "rounded-sm shadow-sm";

        await page.render({ canvasContext: ctx, viewport: viewport }).promise;

        const label = document.createElement('span');
        label.className = 'text-[10px] text-slate-400 mt-1 font-medium';
        label.textContent = `Page ${pageNum}`;

        thumbWrapper.appendChild(canvas);
        thumbWrapper.appendChild(label);

        thumbWrapper.addEventListener('click', () => {
          currentPageIndex = pageNum;
          updateThumbnailSelection();
          renderCurrentPage();
        });

        thumbnailsContainer.appendChild(thumbWrapper);
      }
    }

    function updateThumbnailSelection() {
      document.querySelectorAll('#thumbnails-container > div').forEach(thumb => {
        const pageNum = parseInt(thumb.dataset.pageNum);
        if (pageNum === currentPageIndex) {
          thumb.className = 'cursor-pointer rounded-lg border p-1 transition-all flex flex-col items-center bg-slate-900 border-brand-500 shadow-lg shadow-brand-500/10';
        } else {
          thumb.className = 'cursor-pointer rounded-lg border p-1 transition-all flex flex-col items-center bg-slate-900 border-slate-800 hover:border-slate-700';
        }
      });
    }

    // --- PAGE RENDERER ---
    async function renderCurrentPage() {
      if (!pdfjsDoc) return;

      currentPageNumEl.textContent = currentPageIndex;
      pageWrapper.innerHTML = '';

      const page = await pdfjsDoc.getPage(currentPageIndex);
      const viewport = page.getViewport({ scale: currentZoom });

      const container = document.createElement('div');
      container.className = 'pdf-page-container border border-slate-800 overflow-hidden';
      container.style.width = `${viewport.width}px`;
      container.style.height = `${viewport.height}px`;

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.className = 'absolute top-0 left-0 z-0';

      container.appendChild(canvas);
      await page.render({ canvasContext: ctx, viewport: viewport }).promise;

      const svgLayer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svgLayer.setAttribute('class', 'absolute top-0 left-0 w-full h-full z-10 pointer-events-none');
      svgLayer.setAttribute('width', viewport.width);
      svgLayer.setAttribute('height', viewport.height);
      container.appendChild(svgLayer);

      const textOverlayContainer = document.createElement('div');
      textOverlayContainer.className = 'absolute top-0 left-0 w-full h-full z-20 overflow-hidden';
      container.appendChild(textOverlayContainer);

      const textContent = await page.getTextContent();
      textContent.items.forEach(item => {
        const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
        const fontHeight = Math.sqrt(tx[2] * tx[2] + tx[3] * tx[3]);

        const textDiv = document.createElement('div');
        textDiv.className = 'text-overlay-item';
        textDiv.textContent = item.str;
        textDiv.style.left = `${tx[4]}px`;
        textDiv.style.top = `${tx[5] - fontHeight}px`;
        textDiv.style.fontSize = `${fontHeight}px`;
        textDiv.style.fontFamily = item.fontName || 'sans-serif';
        textDiv.style.color = 'transparent';

        textDiv.addEventListener('click', (e) => {
          if (activeTool === 'edit-text') {
            e.stopPropagation();
            makeNativeTextEditable(textDiv, item, tx[4], tx[5] - fontHeight, fontHeight);
          }
        });

        textOverlayContainer.appendChild(textDiv);
      });

      textOverlayContainer.addEventListener('mousedown', (e) => {
        const rect = textOverlayContainer.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (activeTool === 'add-text') {
          addNewTextBox(textOverlayContainer, x, y);
        } else if (activeTool === 'whiteout') {
          addWhiteoutBox(textOverlayContainer, x, y);
        } else if (activeTool === 'highlight') {
          addHighlightBox(textOverlayContainer, x, y);
        } else if (activeTool === 'draw') {
          startDrawing(svgLayer, x, y);
        } else if (activeTool === 'select') {
          deselectActiveElement();
        }
      });

      restorePageAnnotations(currentPageIndex, textOverlayContainer, svgLayer);
      pageWrapper.appendChild(container);
    }

    // --- NATIVE TEXT EDITING ---
    function makeNativeTextEditable(textDiv, pdfItem, origX, origY, fontSize) {
      textDiv.style.visibility = 'hidden';

      const maskBox = document.createElement('div');
      maskBox.className = 'absolute bg-white z-20';
      maskBox.style.left = `${origX}px`;
      maskBox.style.top = `${origY}px`;
      maskBox.style.width = `${textDiv.offsetWidth + 4}px`;
      maskBox.style.height = `${fontSize * 1.2}px`;
      textDiv.parentElement.appendChild(maskBox);

      const input = document.createElement('div');
      input.contentEditable = true;
      input.className = 'custom-text-box z-30 bg-white border border-brand-500 rounded text-slate-900 font-sans shadow-sm';
      input.style.left = `${origX}px`;
      input.style.top = `${origY}px`;
      input.style.fontSize = `${fontSize}px`;
      input.style.minWidth = `${textDiv.offsetWidth}px`;
      input.textContent = pdfItem.str;

      textDiv.parentElement.appendChild(input);
      input.focus();

      const animData = {
        id: Date.now(),
        type: 'text-edit',
        page: currentPageIndex,
        x: origX / currentZoom,
        y: origY / currentZoom,
        width: textDiv.offsetWidth / currentZoom,
        height: (fontSize * 1.2) / currentZoom,
        origText: pdfItem.str,
        newText: pdfItem.str,
        fontSize: fontSize / currentZoom,
        color: currentTextColor
      };

      if (!pageAnnotations[currentPageIndex]) pageAnnotations[currentPageIndex] = [];
      pageAnnotations[currentPageIndex].push(animData);

      input.addEventListener('input', () => {
        animData.newText = input.textContent;
        maskBox.style.width = `${input.offsetWidth + 4}px`;
      });
    }

    // --- ADD TEXT BOX ---
    function addNewTextBox(container, x, y, textValue = 'Click to edit text', font = currentFontFamily, size = currentFontSize, color = currentTextColor) {
      const textBox = document.createElement('div');
      textBox.contentEditable = true;
      textBox.className = 'custom-text-box z-30 text-slate-900 shadow-sm font-sans';
      textBox.dataset.type = 'add-text';
      textBox.style.left = `${x}px`;
      textBox.style.top = `${y}px`;
      textBox.style.fontSize = `${size * currentZoom}px`;
      textBox.style.fontFamily = getCssFontFamily(font);
      textBox.style.color = color;
      textBox.textContent = textValue;

      container.appendChild(textBox);
      selectElement(textBox);

      const animData = {
        id: Date.now(),
        type: 'add-text',
        page: currentPageIndex,
        x: x / currentZoom,
        y: y / currentZoom,
        text: textValue,
        font: font,
        fontSize: size,
        color: color
      };

      if (!pageAnnotations[currentPageIndex]) pageAnnotations[currentPageIndex] = [];
      pageAnnotations[currentPageIndex].push(animData);
      textBox.dataset.id = animData.id;

      makeElementDraggable(textBox, animData);

      textBox.addEventListener('input', () => {
        animData.text = textBox.textContent;
      });

      textBox.focus();
    }

    // --- WHITEOUT BOX ---
    function addWhiteoutBox(container, x, y, width = 120, height = 30) {
      const box = document.createElement('div');
      box.className = 'custom-annotation absolute bg-white border border-slate-300 z-20 shadow-sm rounded-xs';
      box.style.left = `${x}px`;
      box.style.top = `${y}px`;
      box.style.width = `${width * currentZoom}px`;
      box.style.height = `${height * currentZoom}px`;

      container.appendChild(box);

      const animData = {
        id: Date.now(),
        type: 'whiteout',
        page: currentPageIndex,
        x: x / currentZoom,
        y: y / currentZoom,
        width: width,
        height: height
      };

      if (!pageAnnotations[currentPageIndex]) pageAnnotations[currentPageIndex] = [];
      pageAnnotations[currentPageIndex].push(animData);
      box.dataset.id = animData.id;

      makeElementDraggable(box, animData);
      selectElement(box);
    }

    // --- HIGHLIGHT BOX ---
    function addHighlightBox(container, x, y, width = 140, height = 24) {
      const box = document.createElement('div');
      box.className = 'custom-annotation absolute bg-amber-300/40 border border-amber-400/60 z-20 rounded-xs';
      box.style.left = `${x}px`;
      box.style.top = `${y}px`;
      box.style.width = `${width * currentZoom}px`;
      box.style.height = `${height * currentZoom}px`;

      container.appendChild(box);

      const animData = {
        id: Date.now(),
        type: 'highlight',
        page: currentPageIndex,
        x: x / currentZoom,
        y: y / currentZoom,
        width: width,
        height: height,
        color: '#fde047'
      };

      if (!pageAnnotations[currentPageIndex]) pageAnnotations[currentPageIndex] = [];
      pageAnnotations[currentPageIndex].push(animData);
      box.dataset.id = animData.id;

      makeElementDraggable(box, animData);
      selectElement(box);
    }

    // --- FREEHAND DRAWING ---
    function startDrawing(svgLayer, startX, startY) {
      isDrawing = true;
      const points = [{ x: startX / currentZoom, y: startY / currentZoom }];

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('stroke', currentTextColor);
      path.setAttribute('stroke-width', (2 * currentZoom).toString());
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke-linecap', 'round');

      svgLayer.appendChild(path);

      function onMouseMove(e) {
        if (!isDrawing) return;
        const rect = svgLayer.getBoundingClientRect();
        const nx = e.clientX - rect.left;
        const ny = e.clientY - rect.top;

        points.push({ x: nx / currentZoom, y: ny / currentZoom });

        let d = `M ${points[0].x * currentZoom} ${points[0].y * currentZoom}`;
        for (let i = 1; i < points.length; i++) {
          d += ` L ${points[i].x * currentZoom} ${points[i].y * currentZoom}`;
        }
        path.setAttribute('d', d);
      }

      function onMouseUp() {
        if (!isDrawing) return;
        isDrawing = false;
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);

        const animData = {
          id: Date.now(),
          type: 'draw',
          page: currentPageIndex,
          points: points,
          color: currentTextColor,
          strokeWidth: 2
        };

        if (!pageAnnotations[currentPageIndex]) pageAnnotations[currentPageIndex] = [];
        pageAnnotations[currentPageIndex].push(animData);
      }

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    }

    // --- RESTORE ANNOTATIONS ---
    function restorePageAnnotations(pageNum, container, svgLayer) {
      const items = pageAnnotations[pageNum] || [];
      items.forEach(anim => {
        if (anim.type === 'add-text') {
          const textBox = document.createElement('div');
          textBox.contentEditable = true;
          textBox.className = 'custom-text-box z-30 text-slate-900 shadow-sm font-sans';
          textBox.dataset.type = 'add-text';
          textBox.dataset.id = anim.id;
          textBox.style.left = `${anim.x * currentZoom}px`;
          textBox.style.top = `${anim.y * currentZoom}px`;
          textBox.style.fontSize = `${anim.fontSize * currentZoom}px`;
          textBox.style.fontFamily = getCssFontFamily(anim.font);
          textBox.style.color = anim.color;
          textBox.textContent = anim.text;

          container.appendChild(textBox);
          makeElementDraggable(textBox, anim);

          textBox.addEventListener('input', () => {
            anim.text = textBox.textContent;
          });
        } else if (anim.type === 'whiteout') {
          const box = document.createElement('div');
          box.className = 'custom-annotation absolute bg-white border border-slate-300 z-20 shadow-sm rounded-xs';
          box.dataset.id = anim.id;
          box.style.left = `${anim.x * currentZoom}px`;
          box.style.top = `${anim.y * currentZoom}px`;
          box.style.width = `${anim.width * currentZoom}px`;
          box.style.height = `${anim.height * currentZoom}px`;

          container.appendChild(box);
          makeElementDraggable(box, anim);
        } else if (anim.type === 'highlight') {
          const box = document.createElement('div');
          box.className = 'custom-annotation absolute bg-amber-300/40 border border-amber-400/60 z-20 rounded-xs';
          box.dataset.id = anim.id;
          box.style.left = `${anim.x * currentZoom}px`;
          box.style.top = `${anim.y * currentZoom}px`;
          box.style.width = `${anim.width * currentZoom}px`;
          box.style.height = `${anim.height * currentZoom}px`;

          container.appendChild(box);
          makeElementDraggable(box, anim);
        } else if (anim.type === 'draw') {
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('stroke', anim.color);
          path.setAttribute('stroke-width', (anim.strokeWidth * currentZoom).toString());
          path.setAttribute('fill', 'none');
          path.setAttribute('stroke-linecap', 'round');

          let d = `M ${anim.points[0].x * currentZoom} ${anim.points[0].y * currentZoom}`;
          for (let i = 1; i < anim.points.length; i++) {
            d += ` L ${anim.points[i].x * currentZoom} ${anim.points[i].y * currentZoom}`;
          }
          path.setAttribute('d', d);
          svgLayer.appendChild(path);
        }
      });
    }

    // --- DRAG HELPER ---
    function makeElementDraggable(element, animData) {
      let isDragging = false;
      let startX, startY;

      element.addEventListener('mousedown', (e) => {
        if (activeTool !== 'select') return;
        e.stopPropagation();
        selectElement(element);

        isDragging = true;
        startX = e.clientX - element.offsetLeft;
        startY = e.clientY - element.offsetTop;

        function onMouseMove(me) {
          if (!isDragging) return;
          const newX = me.clientX - startX;
          const newY = me.clientY - startY;

          element.style.left = `${newX}px`;
          element.style.top = `${newY}px`;

          animData.x = newX / currentZoom;
          animData.y = newY / currentZoom;
        }

        function onMouseUp() {
          isDragging = false;
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
        }

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });
    }

    // --- SELECTION & DELETION ---
    function selectElement(el) {
      deselectActiveElement();
      activeSelectedElement = el;
      el.classList.add('selected');
      btnDeleteElement.classList.remove('hidden');
    }

    function deselectActiveElement() {
      if (activeSelectedElement) {
        activeSelectedElement.classList.remove('selected');
        activeSelectedElement = null;
      }
      btnDeleteElement.classList.add('hidden');
    }

    function deleteSelectedElement() {
      if (!activeSelectedElement) return;

      const id = activeSelectedElement.dataset.id;
      if (id && pageAnnotations[currentPageIndex]) {
        pageAnnotations[currentPageIndex] = pageAnnotations[currentPageIndex].filter(a => a.id != id);
      }

      activeSelectedElement.remove();
      deselectActiveElement();
      showToast('Element removed', 'info');
    }

    function updateElementAnnotationData(el) {
      const id = el.dataset.id;
      if (!id || !pageAnnotations[currentPageIndex]) return;
      const anim = pageAnnotations[currentPageIndex].find(a => a.id == id);
      if (anim) {
        anim.font = currentFontFamily;
        anim.fontSize = currentFontSize;
        anim.color = currentTextColor;
      }
    }

    // --- NAVIGATION & ZOOM ---
    function changePage(delta) {
      const targetPage = currentPageIndex + delta;
      if (targetPage >= 1 && targetPage <= totalPages) {
        currentPageIndex = targetPage;
        updateThumbnailSelection();
        renderCurrentPage();
      }
    }

    function setZoom(newZoom) {
      if (newZoom < 0.5 || newZoom > 2.5) return;
      currentZoom = parseFloat(newZoom.toFixed(2));
      zoomPercentageEl.textContent = `${Math.round(currentZoom * 100)}%`;
      renderCurrentPage();
    }

    function getCssFontFamily(font) {
      if (font === 'Helvetica') return 'sans-serif';
      if (font === 'Times-Roman') return 'serif';
      if (font === 'Courier') return 'monospace';
      return 'sans-serif';
    }

    // --- EXPORT MODIFIED PDF ---
    async function exportModifiedPDF() {
      if (!pdfLibDoc) return;

      try {
        showToast('Building document...', 'info');

        const pages = pdfLibDoc.getPages();
        const fontHelvetica = await pdfLibDoc.embedFont(PDFLib.StandardFonts.Helvetica);
        const fontTimes = await pdfLibDoc.embedFont(PDFLib.StandardFonts.TimesRoman);
        const fontCourier = await pdfLibDoc.embedFont(PDFLib.StandardFonts.Courier);

        const fontMap = {
          'Helvetica': fontHelvetica,
          'Times-Roman': fontTimes,
          'Courier': fontCourier
        };

        for (let pIdx = 1; pIdx <= totalPages; pIdx++) {
          const pdfPage = pages[pIdx - 1];
          const { width, height } = pdfPage.getSize();

          const jsPage = await pdfjsDoc.getPage(pIdx);
          const baseViewport = jsPage.getViewport({ scale: 1.0 });

          const scaleX = width / baseViewport.width;
          const scaleY = height / baseViewport.height;

          const annotations = pageAnnotations[pIdx] || [];

          for (const anim of annotations) {
            if (anim.type === 'text-edit') {
              const pdfX = anim.x * scaleX;
              const pdfY = height - ((anim.y + anim.height) * scaleY);

              pdfPage.drawRectangle({
                x: pdfX,
                y: pdfY,
                width: anim.width * scaleX,
                height: anim.height * scaleY,
                color: PDFLib.rgb(1, 1, 1)
              });

              if (anim.newText) {
                const hexColor = hexToRgbNormalized(anim.color || '#000000');
                pdfPage.drawText(anim.newText, {
                  x: pdfX,
                  y: pdfY + (2 * scaleY),
                  size: anim.fontSize * scaleY,
                  font: fontHelvetica,
                  color: PDFLib.rgb(hexColor.r, hexColor.g, hexColor.b)
                });
              }
            } else if (anim.type === 'add-text') {
              const pdfX = anim.x * scaleX;
              const pdfY = height - ((anim.y + anim.fontSize) * scaleY);
              const hexColor = hexToRgbNormalized(anim.color || '#000000');
              const selectedFont = fontMap[anim.font] || fontHelvetica;

              pdfPage.drawText(anim.text || '', {
                x: pdfX,
                y: pdfY,
                size: (anim.fontSize || 14) * scaleY,
                font: selectedFont,
                color: PDFLib.rgb(hexColor.r, hexColor.g, hexColor.b)
              });
            } else if (anim.type === 'whiteout') {
              const pdfX = anim.x * scaleX;
              const pdfY = height - ((anim.y + anim.height) * scaleY);

              pdfPage.drawRectangle({
                x: pdfX,
                y: pdfY,
                width: anim.width * scaleX,
                height: anim.height * scaleY,
                color: PDFLib.rgb(1, 1, 1)
              });
            } else if (anim.type === 'highlight') {
              const pdfX = anim.x * scaleX;
              const pdfY = height - ((anim.y + anim.height) * scaleY);

              pdfPage.drawRectangle({
                x: pdfX,
                y: pdfY,
                width: anim.width * scaleX,
                height: anim.height * scaleY,
                color: PDFLib.rgb(0.99, 0.87, 0.28),
                opacity: 0.4
              });
            } else if (anim.type === 'draw') {
              if (anim.points && anim.points.length > 1) {
                const hexColor = hexToRgbNormalized(anim.color || '#000000');
                for (let i = 0; i < anim.points.length - 1; i++) {
                  const p1 = anim.points[i];
                  const p2 = anim.points[i + 1];

                  pdfPage.drawLine({
                    start: { x: p1.x * scaleX, y: height - (p1.y * scaleY) },
                    end: { x: p2.x * scaleX, y: height - (p2.y * scaleY) },
                    thickness: (anim.strokeWidth || 2) * scaleX,
                    color: PDFLib.rgb(hexColor.r, hexColor.g, hexColor.b)
                  });
                }
              }
            }
          }
        }

        const modifiedPdfBytes = await pdfLibDoc.save();
        const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `document_${Date.now()}.pdf`;
        link.click();

        showToast('Document exported successfully', 'success');
      } catch (err) {
        console.error(err);
        showToast('Failed to export PDF.', 'error');
      }
    }

    function hexToRgbNormalized(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) {
        c = c.split('').map(x => x + x).join('');
      }
      const num = parseInt(c, 16);
      return {
        r: ((num >> 16) & 255) / 255,
        g: ((num >> 8) & 255) / 255,
        b: (num & 255) / 255
      };
    }

    // --- SAMPLE PDF DEMO ---
    async function loadSamplePDF() {
      try {
        const sampleDoc = await PDFLib.PDFDocument.create();
        const page = sampleDoc.addPage([600, 750]);
        const { width, height } = page.getSize();

          x: 50,

          font: font,

        });

        page.drawText('REF: #AGR-2026-98124', {
          x: 50,

          '4. Confidentiality: Both parties commit to strictly protecting confidential material.',

        showToast('Failed to generate sample PDF.', 'error');
      }
    }

    // --- TOAST NOTIFICATIONS ---
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');

      toastMsg.textContent = message;

      if (type === 'success') {
        toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-sm';
      } else if (type === 'error') {
        toastIcon.className = 'fa-solid fa-circle-exclamation text-rose-400 text-sm';
      } else {
        toastIcon.className = 'fa-solid fa-circle-info text-brand-400 text-sm';
      }

      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }
  </script>
