<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Handle Pro - Handle your PDF Files</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            roboto: ['Roboto', 'sans-serif'],
            poppins: ['Poppins', 'sans-serif'],
            montserrat: ['Montserrat', 'sans-serif'],
            playfair: ['Playfair Display', 'serif'],
            merriweather: ['Merriweather', 'serif']
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@300;400;700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  
  <!-- PDF-Lib -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <style>
    body {
      min-height: -webkit-fill-available;
      touch-action: manipulation;
    }
    
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    .pdf-page-container {
      position: relative;
      box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.6);
      background-color: #ffffff;
      border-radius: 4px;
      margin: 0 auto;
      max-width: 100%;
    }

    /* Interactive Draggable Layer for Objects */
    .selectable-object {
      position: absolute;
      cursor: move;
      border: 1px dashed transparent;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      box-sizing: border-box;
      user-select: none;
    }
    .selectable-object:hover {
      border-color: rgba(37, 99, 235, 0.6);
      background-color: rgba(59, 130, 246, 0.08);
    }
    .selectable-object.selected {
      border: 1.5px solid #2563eb !important;
      background-color: rgba(59, 130, 246, 0.15) !important;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    .custom-text-box {
      position: absolute;
      outline: none;
      min-width: 32px;
      padding: 2px 4px;
      line-height: 1.2;
      word-break: break-word;
      border: 1px dashed #2563eb;
      background: rgba(255, 255, 255, 0.95);
      cursor: move;
    }

    .custom-text-box[contenteditable="true"] {
      cursor: text;
    }

    .color-swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      touch-action: manipulation;
    }
    .color-swatch.active {
      border-color: #ffffff;
      box-shadow: 0 0 0 2px #2563eb;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 antialiased max-w-full overflow-x-hidden">

  <!-- TOP HEADER / APP BAR -->
  <header class="bg-slate-950/90 backdrop-blur border-b border-slate-800/80 px-4 py-2.5 flex items-center justify-between shrink-0 z-30 w-full">
    <!-- Brand -->
    <div class="flex items-center space-x-3 min-w-0">
      <div class="bg-brand-600 text-white w-8 h-8 rounded-lg flex items-center justify-center shrink-0 shadow-md">
        <i class="fa-solid fa-file-contract text-sm"></i>
      </div>
      <div class="truncate">
        <h1 class="font-bold text-slate-100 text-xs sm:text-sm tracking-tight truncate flex items-center gap-1.5">
          Handle Pro
          <span class="text-[9px] bg-slate-800 text-brand-400 border border-slate-700/60 px-1.5 py-0.5 rounded font-semibold uppercase tracking-wider">v1.0.3</span>
        </h1>
        <p class="text-[10px] text-slate-400 font-medium truncate" id="file-info">Handle your PDF Files</p>
      </div>
    </div>

    <!-- Actions & History -->
    <div class="flex items-center space-x-2 shrink-0">
      <!-- Undo / Redo Buttons -->
      <div class="flex items-center bg-slate-900 border border-slate-800 rounded-lg p-0.5 mr-1">
        <button id="btn-undo" disabled class="p-1.5 text-slate-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed text-xs transition" title="Undo (Ctrl+Z)">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
        <div class="w-px h-3 bg-slate-800"></div>
        <button id="btn-redo" disabled class="p-1.5 text-slate-400 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed text-xs transition" title="Redo (Ctrl+Y)">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>

      <input type="file" id="pdf-file-input" accept="application/pdf" class="hidden" />
      
      <button id="btn-open-file" class="bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs px-3 py-1.5 rounded-lg border border-slate-800 flex items-center gap-1.5 transition">
        <i class="fa-solid fa-folder-open text-brand-400"></i> <span class="hidden sm:inline">Open</span>
      </button>

        <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> <span class="hidden sm:inline">Demo</span>

        <i class="fa-solid fa-download"></i> Save
      </button>
    </div>
  </header>

  <!-- TOOLBAR 1: MAIN TOOLS -->
  <div class="bg-slate-900/90 border-b border-slate-800/80 px-3 py-2 shrink-0 z-20 w-full overflow-x-auto no-scrollbar">
    <div class="flex items-center justify-start sm:justify-center space-x-2 min-w-max px-2">
      <button data-tool="select" class="tool-btn active bg-brand-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
        <i class="fa-solid fa-arrow-pointer"></i> Select & Move
      </button>
      <button data-tool="edit-text" class="tool-btn text-slate-400 hover:text-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
        <i class="fa-solid fa-pen-to-square text-brand-400"></i> Edit Native Text
      </button>
      <button data-tool="add-text" class="tool-btn text-slate-400 hover:text-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
        <i class="fa-solid fa-font text-emerald-400"></i> Add Text
      </button>
      <button data-tool="whiteout" class="tool-btn text-slate-400 hover:text-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
        <i class="fa-solid fa-eraser text-rose-400"></i> Erase Box
      </button>
      <button data-tool="highlight" class="tool-btn text-slate-400 hover:text-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
        <i class="fa-solid fa-highlighter text-amber-400"></i> Highlight

      <button data-tool="draw" class="tool-btn text-slate-400 hover:text-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
        <i class="fa-solid fa-signature text-sky-400"></i> Freehand Draw

    </div>
  </div>

  <!-- TOOLBAR 2: FORMATTING & PAGINATION BAR -->
  <div class="bg-slate-950 border-b border-slate-800/80 px-4 py-1.5 shrink-0 z-10 w-full overflow-x-auto no-scrollbar">
    <div class="flex items-center justify-between min-w-max space-x-4 text-xs">
      
      <!-- Typeface & Text Properties Selector -->
      <div class="flex items-center space-x-2">
        <select id="font-family-select" class="bg-slate-900 text-slate-200 border border-slate-800 rounded-lg px-2.5 py-1 text-xs outline-none focus:border-brand-500">
          <option value="Helvetica">Helvetica</option>
          <option value="Roboto">Roboto</option>
          <option value="Poppins">Poppins</option>
          <option value="Montserrat">Montserrat</option>
          <option value="Playfair">Playfair Display</option>
          <option value="Merriweather">Merriweather</option>
          <option value="Times-Roman">Times Roman</option>
          <option value="Courier">Courier</option>
        </select>

        <input type="number" id="font-size-input" min="6" max="99" value="14" class="w-12 bg-slate-900 text-slate-200 border border-slate-800 rounded-lg px-1.5 py-1 text-center text-xs outline-none focus:border-brand-500" />
      </div>

      <!-- Color Swatches -->
      <div class="flex items-center space-x-1.5 border-x border-slate-800 px-3">
        <div class="color-swatch active bg-black border border-slate-700" data-color="#000000"></div>
        <div class="color-swatch bg-blue-600" data-color="#2563eb"></div>
        <div class="color-swatch bg-red-600" data-color="#dc2626"></div>
        <input type="color" id="custom-color-picker" value="#000000" class="w-5 h-5 rounded bg-transparent border-0 p-0 cursor-pointer" />
      </div>

      <!-- Navigation & High-DPI Zoom Controls -->
      <div class="flex items-center space-x-2">
        <button id="btn-prev-page" class="p-1 text-slate-400 hover:text-white transition"><i class="fa-solid fa-chevron-left"></i></button>
        <span class="text-slate-300 font-semibold"><span id="current-page-num">0</span>/<span id="total-pages-num">0</span></span>
        <button id="btn-next-page" class="p-1 text-slate-400 hover:text-white transition"><i class="fa-solid fa-chevron-right"></i></button>

        <div class="h-3 w-px bg-slate-800 my-auto"></div>

        <button id="btn-zoom-out" class="p-1 text-slate-400 hover:text-white transition"><i class="fa-solid fa-minus"></i></button>
        <span id="zoom-percentage" class="text-slate-400 text-[11px] min-w-[36px] text-center">100%</span>
        <button id="btn-zoom-in" class="p-1 text-slate-400 hover:text-white transition"><i class="fa-solid fa-plus"></i></button>
      </div>

      <!-- Delete Selected Object Button -->
      <button id="btn-delete-element" class="hidden bg-rose-900/60 hover:bg-rose-900 text-rose-200 border border-rose-700/60 px-2.5 py-1 rounded-md text-xs flex items-center gap-1 transition">
        <i class="fa-solid fa-trash-can"></i> Delete
      </button>

    </div>
  </div>

  <!-- CENTER VIEWPORT WORKSPACE -->
  <main id="editor-viewport" class="flex-1 overflow-auto p-4 sm:p-6 bg-slate-900/60 relative flex items-start justify-center min-h-0 w-full">
    
    <!-- EMPTY STATE -->
    <div id="empty-state" class="my-auto text-center p-6 max-w-sm border border-slate-800 rounded-2xl bg-slate-950/80 shadow-2xl backdrop-blur mx-auto">
      <div class="w-12 h-12 bg-brand-500/10 text-brand-500 border border-brand-500/20 rounded-xl flex items-center justify-center mx-auto mb-3 text-lg">
        <i class="fa-solid fa-file-pdf"></i>
      </div>
      <h2 class="text-sm font-semibold text-slate-100 mb-1">Handle Pro v1.0.3</h2>
      <p class="text-xs text-slate-400 mb-5 leading-relaxed">
        Realtime high-definition document view. Select objects, images, and edit text seamlessly.
      </p>
      <div class="flex flex-col gap-2.5">
        <button onclick="document.getElementById('pdf-file-input').click()" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-medium text-xs px-4 py-2.5 rounded-lg transition flex items-center justify-center gap-2 shadow-lg">
          <i class="fa-solid fa-upload"></i> Open PDF File
        </button>
        <button onclick="loadSamplePDF()" class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-medium text-xs px-4 py-2 rounded-lg transition flex items-center justify-center gap-2">

        </button>
      </div>

    <!-- HIGH-DEFINITION CANVAS CONTAINER -->

      <!-- High-DPI Canvas & Interactive Overlay Container -->
    </div>

  <!-- FOOTER COPYRIGHT -->
  <footer class="bg-slate-950 border-t border-slate-900 py-2 px-4 text-center shrink-0 z-30">
    <p class="text-[10px] text-slate-500 font-medium">
      All rights reserved, Josh Flames 2026
    </p>
  </footer>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 border border-slate-700 text-slate-200 text-xs px-4 py-2 rounded-xl shadow-2xl transition-all transform translate-y-20 opacity-0 flex items-center gap-2 z-50 pointer-events-none">
    <i id="toast-icon" class="fa-solid fa-circle-info text-brand-400"></i>
    <span id="toast-msg">Notification</span>
  </div>

  <!-- APPLICATION CODE -->
  <script>
    let rawPdfBytes = null;
    let pdfjsDoc = null;
    let pdfLibDoc = null;
    let currentPageIndex = 1;
    let totalPages = 0;
    let currentZoom = 1.0;
    let activeTool = 'select';
    
    let currentFontFamily = 'Helvetica';
    let currentFontSize = 14;
    let currentTextColor = '#000000';

    // State Stack & History Management
    const pageAnnotations = {}; 
    const undoStack = [];
    const redoStack = [];

    let selectedObjectRef = null;
    let activeDragElement = null;
    let isDrawing = false;

    // DOM Elements
    const fileInput = document.getElementById('pdf-file-input');
    const btnOpenFile = document.getElementById('btn-open-file');
    const btnSamplePdf = document.getElementById('btn-sample-pdf');
    const btnExportPdf = document.getElementById('btn-export-pdf');
    const emptyState = document.getElementById('empty-state');
    const pageWrapper = document.getElementById('page-render-wrapper');
    const fileInfo = document.getElementById('file-info');

    const btnUndo = document.getElementById('btn-undo');
    const btnRedo = document.getElementById('btn-redo');

    const currentPageNumEl = document.getElementById('current-page-num');
    const totalPagesNumEl = document.getElementById('total-pages-num');
    const zoomPercentageEl = document.getElementById('zoom-percentage');

    const btnPrevPage = document.getElementById('btn-prev-page');
    const btnNextPage = document.getElementById('btn-next-page');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');

    const toolButtons = document.querySelectorAll('.tool-btn');
    const fontFamilySelect = document.getElementById('font-family-select');
    const fontSizeInput = document.getElementById('font-size-input');
    const colorSwatches = document.querySelectorAll('.color-swatch');
    const customColorPicker = document.getElementById('custom-color-picker');
    const btnDeleteElement = document.getElementById('btn-delete-element');

    window.addEventListener('DOMContentLoaded', () => {
      setupEventListeners();
    });

    function setupEventListeners() {
      btnOpenFile.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', handleFileSelect);
      btnSamplePdf.addEventListener('click', loadSamplePDF);
      btnExportPdf.addEventListener('click', exportModifiedPDF);

      btnPrevPage.addEventListener('click', () => changePage(-1));
      btnNextPage.addEventListener('click', () => changePage(1));

      btnZoomIn.addEventListener('click', () => setZoom(currentZoom + 0.15));
      btnZoomOut.addEventListener('click', () => setZoom(currentZoom - 0.15));

      btnUndo.addEventListener('click', undoAction);
      btnRedo.addEventListener('click', redoAction);

      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
          e.preventDefault();
          undoAction();
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
          e.preventDefault();
          redoAction();
        } else if (e.key === 'Delete' || e.key === 'Backspace') {
          if (selectedObjectRef && document.activeElement.tagName !== 'INPUT' && !document.activeElement.isContentEditable) {
            deleteSelectedElement();
          }
        }
      });

      toolButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          toolButtons.forEach(b => {
            b.classList.remove('active', 'bg-brand-600', 'text-white');
            b.classList.add('text-slate-400');
          });
          btn.classList.add('active', 'bg-brand-600', 'text-white');
          btn.classList.remove('text-slate-400');
          
          activeTool = btn.getAttribute('data-tool');
          deselectActiveObject();
          showToast(`Mode: ${btn.textContent.trim()}`);
        });
      });

      fontFamilySelect.addEventListener('change', (e) => {
        currentFontFamily = e.target.value;
        if (selectedObjectRef && selectedObjectRef.classList.contains('custom-text-box')) {
          selectedObjectRef.style.fontFamily = getCssFontFamily(currentFontFamily);
          updateSelectedAnnotationData({ font: currentFontFamily });
        }
      });

      fontSizeInput.addEventListener('input', (e) => {
        currentFontSize = parseInt(e.target.value) || 14;
        if (selectedObjectRef && selectedObjectRef.classList.contains('custom-text-box')) {
          selectedObjectRef.style.fontSize = `${currentFontSize * currentZoom}px`;
          updateSelectedAnnotationData({ fontSize: currentFontSize });
        }
      });

      colorSwatches.forEach(swatch => {
        swatch.addEventListener('click', () => {
          colorSwatches.forEach(s => s.classList.remove('active'));
          swatch.classList.add('active');
          currentTextColor = swatch.getAttribute('data-color');
          applyColorToSelection(currentTextColor);
        });
      });

      customColorPicker.addEventListener('input', (e) => {
        currentTextColor = e.target.value;
        colorSwatches.forEach(s => s.classList.remove('active'));
        applyColorToSelection(currentTextColor);
      });

      btnDeleteElement.addEventListener('click', deleteSelectedElement);
    }

    function applyColorToSelection(color) {
      if (selectedObjectRef && selectedObjectRef.classList.contains('custom-text-box')) {
        selectedObjectRef.style.color = color;
        updateSelectedAnnotationData({ color: color });
      }
    }

    function updateSelectedAnnotationData(props) {
      if (!selectedObjectRef) return;
      const annId = selectedObjectRef.getAttribute('data-id');
      if (annId) {
        const pageAnns = pageAnnotations[currentPageIndex] || [];
        const item = pageAnns.find(a => a.id === parseInt(annId));
        if (item) {
          Object.assign(item, props);
        }
      }
    }

    function recordAction(action) {
      undoStack.push(action);
      redoStack.length = 0;
      updateHistoryButtons();
    }

    function updateHistoryButtons() {
      btnUndo.disabled = undoStack.length === 0;
      btnRedo.disabled = redoStack.length === 0;
    }

    function undoAction() {
      if (undoStack.length === 0) return;
      const action = undoStack.pop();
      redoStack.push(action);

      const pageAnns = pageAnnotations[action.page] || [];
      if (action.type === 'add') {
        const idx = pageAnns.findIndex(a => a.id === action.item.id);
        if (idx !== -1) pageAnns.splice(idx, 1);
      } else if (action.type === 'remove') {
        pageAnns.push(action.item);
      } else if (action.type === 'move') {
        const item = pageAnns.find(a => a.id === action.item.id);
        if (item) {
          item.x = action.oldX;
          item.y = action.oldY;
        }
      }

      updateHistoryButtons();
      renderCurrentPage();
      showToast('Action Undone');
    }

    function redoAction() {
      if (redoStack.length === 0) return;
      const action = redoStack.pop();
      undoStack.push(action);

      if (!pageAnnotations[action.page]) pageAnnotations[action.page] = [];
      const pageAnns = pageAnnotations[action.page];

      if (action.type === 'add') {
        pageAnns.push(action.item);
      } else if (action.type === 'remove') {
        const idx = pageAnns.findIndex(a => a.id === action.item.id);
        if (idx !== -1) pageAnns.splice(idx, 1);
      } else if (action.type === 'move') {
        const item = pageAnns.find(a => a.id === action.item.id);
        if (item) {
          item.x = action.newX;
          item.y = action.newY;
        }
      }

      updateHistoryButtons();
      renderCurrentPage();
      showToast('Action Redone');
    }

    function getCssFontFamily(font) {
      switch(font) {
        case 'Roboto': return "'Roboto', sans-serif";
        case 'Poppins': return "'Poppins', sans-serif";
        case 'Montserrat': return "'Montserrat', sans-serif";
        case 'Playfair': return "'Playfair Display', serif";
        case 'Merriweather': return "'Merriweather', serif";
        case 'Times-Roman': return "serif";
        case 'Courier': return "monospace";
        default: return "sans-serif";
      }
    }

    async function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file || file.type !== 'application/pdf') {
        showToast('Please select a valid PDF file.', 'error');
        return;
      }

      fileInfo.textContent = file.name;
      const arrayBuffer = await file.arrayBuffer();
      loadPDFBytes(arrayBuffer);
    }

    async function loadPDFBytes(arrayBuffer) {
      try {
        showToast('Rendering Document...', 'info');
        rawPdfBytes = arrayBuffer;

        Object.keys(pageAnnotations).forEach(k => delete pageAnnotations[k]);
        undoStack.length = 0;
        redoStack.length = 0;
        updateHistoryButtons();

        currentPageIndex = 1;

        pdfjsDoc = await pdfjsLib.getDocument({ data: rawPdfBytes.slice(0) }).promise;
        totalPages = pdfjsDoc.numPages;

        pdfLibDoc = await PDFLib.PDFDocument.load(rawPdfBytes.slice(0));

        emptyState.classList.add('hidden');
        pageWrapper.classList.remove('hidden');
        btnExportPdf.disabled = false;

        totalPagesNumEl.textContent = totalPages;

        await renderCurrentPage();
        showToast('Document View Ready', 'success');
      } catch (err) {
        console.error(err);
        showToast('Error loading PDF.', 'error');
      }
    }

    /* REALTIME ULTRA-CLEAR HIGH-DPI DOCUMENT VIEWER ENGINE */
    async function renderCurrentPage() {
      if (!pdfjsDoc) return;

      currentPageNumEl.textContent = currentPageIndex;
      pageWrapper.innerHTML = '';

      const page = await pdfjsDoc.getPage(currentPageIndex);
      
      const screenWidth = window.innerWidth - 32;
      const unscaledViewport = page.getViewport({ scale: 1.0 });
      const responsiveScale = Math.min((screenWidth / unscaledViewport.width), 1.4) * currentZoom;
      
      const viewport = page.getViewport({ scale: responsiveScale });

      // HIGH-DPI DEVICE PIXEL RATIO CALCULATION FOR CRISP CLEAR DISPLAY
      const dpr = window.devicePixelRatio || 1;

      const container = document.createElement('div');
      container.className = 'pdf-page-container border border-slate-800 overflow-hidden';
      container.style.width = `${viewport.width}px`;
      container.style.height = `${viewport.height}px`;

      // Canvas element scaled by DPR for ultra-clear rendering
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);
      canvas.style.width = `${viewport.width}px`;
      canvas.style.height = `${viewport.height}px`;
      canvas.className = 'absolute top-0 left-0 z-0';

      ctx.scale(dpr, dpr);

      container.appendChild(canvas);

      // Render PDF page with high precision
      await page.render({
        canvasContext: ctx,
        viewport: viewport
      }).promise;

      // SVG Vector Layer
      const svgLayer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svgLayer.setAttribute('class', 'absolute top-0 left-0 w-full h-full z-10 pointer-events-none');
      svgLayer.setAttribute('width', viewport.width);
      svgLayer.setAttribute('height', viewport.height);
      container.appendChild(svgLayer);

      // Interactive Overlay Layer
      const overlayContainer = document.createElement('div');
      overlayContainer.className = 'absolute top-0 left-0 w-full h-full z-20 overflow-hidden';
      container.appendChild(overlayContainer);

      // NATIVE TEXT & IMAGE SELECTION ENGINE
      const textContent = await page.getTextContent();
      textContent.items.forEach(item => {
        const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
        const fontHeight = Math.sqrt(tx[2] * tx[2] + tx[3] * tx[3]);

        const objBox = document.createElement('div');
        objBox.className = 'selectable-object';
        objBox.style.left = `${tx[4]}px`;
        objBox.style.top = `${tx[5] - fontHeight}px`;
        objBox.style.width = `${Math.max(item.width * responsiveScale, 20)}px`;
        objBox.style.height = `${fontHeight * 1.1}px`;
        objBox.setAttribute('data-type', 'native-text');
        objBox.setAttribute('data-str', item.str);

        objBox.addEventListener('click', (e) => {
          e.stopPropagation();
          if (activeTool === 'select') {
            selectObject(objBox, 'PDF Text Line', item.str);
          } else if (activeTool === 'edit-text') {
            makeNativeTextEditable(objBox, item, tx[4], tx[5] - fontHeight, fontHeight, responsiveScale);
          }
        });

        makeElementDraggable(objBox, overlayContainer, responsiveScale);
        overlayContainer.appendChild(objBox);
      });

      // Canvas Tool Handlers
      overlayContainer.addEventListener('pointerdown', (e) => {
        if (e.target !== overlayContainer) return;

        const rect = overlayContainer.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (activeTool === 'add-text') {
          addNewTextBox(overlayContainer, x, y, responsiveScale);
        } else if (activeTool === 'whiteout') {
          addWhiteoutBox(overlayContainer, x, y, responsiveScale);
        } else if (activeTool === 'highlight') {
          addHighlightBox(overlayContainer, x, y, responsiveScale);
        } else if (activeTool === 'draw') {
          startDrawing(svgLayer, x, y, responsiveScale);
        } else if (activeTool === 'select') {
          deselectActiveObject();
        }
      });

      restorePageAnnotations(currentPageIndex, overlayContainer, svgLayer, responsiveScale);
      pageWrapper.appendChild(container);
    }

    function makeElementDraggable(el, container, scale) {
      let isDragging = false;
      let startX, startY, origLeft, origTop;

      el.addEventListener('pointerdown', (e) => {
        if (activeTool !== 'select' || e.target.isContentEditable) return;
        isDragging = true;
        activeDragElement = el;
        
        startX = e.clientX;
        startY = e.clientY;
        origLeft = parseFloat(el.style.left) || 0;
        origTop = parseFloat(el.style.top) || 0;

        el.setPointerCapture(e.pointerId);
        selectObject(el, 'Object', 'Element');
      });

      el.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        const newLeft = origLeft + dx;
        const newTop = origTop + dy;

        el.style.left = `${newLeft}px`;
        el.style.top = `${newTop}px`;
      });

      el.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        el.releasePointerCapture(e.pointerId);

        const newLeft = parseFloat(el.style.left) || 0;
        const newTop = parseFloat(el.style.top) || 0;

        const annId = el.getAttribute('data-id');
        if (annId) {
          const pageAnns = pageAnnotations[currentPageIndex] || [];
          const item = pageAnns.find(a => a.id === parseInt(annId));
          if (item) {
            const oldX = item.x;
            const oldY = item.y;
            item.x = newLeft / scale;
            item.y = newTop / scale;

            recordAction({
              type: 'move',
              page: currentPageIndex,
              item: item,
              oldX: oldX,
              oldY: oldY,
              newX: item.x,
              newY: item.y
            });
          }
        }
      });
    }

    function selectObject(el, title, text) {
      deselectActiveObject();
      selectedObjectRef = el;
      el.classList.add('selected');
      btnDeleteElement.classList.remove('hidden');
      showToast(`Selected: ${title}`);
    }

    function deselectActiveObject() {
      if (selectedObjectRef) {
        selectedObjectRef.classList.remove('selected');
        selectedObjectRef = null;
      }
      btnDeleteElement.classList.add('hidden');
    }

    function deleteSelectedElement() {
      if (!selectedObjectRef) return;

      const annId = selectedObjectRef.getAttribute('data-id');
      if (annId) {
        const pageAnns = pageAnnotations[currentPageIndex] || [];
        const idx = pageAnns.findIndex(a => a.id === parseInt(annId));
        if (idx !== -1) {
          const removed = pageAnns.splice(idx, 1)[0];
          recordAction({ type: 'remove', page: currentPageIndex, item: removed });
        }
      }

      selectedObjectRef.remove();
      deselectActiveObject();
      showToast('Object Deleted');
    }

    function makeNativeTextEditable(targetDiv, pdfItem, origX, origY, fontSize, scale) {
      targetDiv.style.visibility = 'hidden';

      const input = document.createElement('div');
      input.contentEditable = true;
      input.className = 'custom-text-box z-30 text-slate-900 shadow-lg';
      input.style.left = `${origX}px`;
      input.style.top = `${origY}px`;
      input.style.fontSize = `${fontSize}px`;
      input.style.fontFamily = getCssFontFamily(currentFontFamily);
      input.textContent = pdfItem.str;

      targetDiv.parentElement.appendChild(input);
      input.focus();

      const itemData = {
        id: Date.now(),
        type: 'text-edit',
        page: currentPageIndex,
        x: origX / scale,
        y: origY / scale,
        width: (targetDiv.offsetWidth + 8) / scale,
        height: (fontSize * 1.2) / scale,
        newText: pdfItem.str,
        fontSize: fontSize / scale,
        color: currentTextColor
      };

      if (!pageAnnotations[currentPageIndex]) pageAnnotations[currentPageIndex] = [];
      pageAnnotations[currentPageIndex].push(itemData);
      recordAction({ type: 'add', page: currentPageIndex, item: itemData });

      input.addEventListener('input', () => {
        itemData.newText = input.textContent;
      });

      makeElementDraggable(input, targetDiv.parentElement, scale);
    }

    function addNewTextBox(container, x, y, scale) {
      const itemData = {
        id: Date.now(),
        type: 'add-text',
        page: currentPageIndex,
        x: x / scale,
        y: y / scale,
        text: 'Click to edit text',
        font: currentFontFamily,
        fontSize: currentFontSize,
        color: currentTextColor
      };

      if (!pageAnnotations[currentPageIndex]) pageAnnotations[currentPageIndex] = [];
      pageAnnotations[currentPageIndex].push(itemData);
      recordAction({ type: 'add', page: currentPageIndex, item: itemData });

      renderCurrentPage();
    }

    function addWhiteoutBox(container, x, y, scale) {
      const itemData = {
        id: Date.now(),
        type: 'whiteout',
        page: currentPageIndex,
        x: x / scale,
        y: y / scale,
        width: 100,
        height: 24
      };

      if (!pageAnnotations[currentPageIndex]) pageAnnotations[currentPageIndex] = [];
      pageAnnotations[currentPageIndex].push(itemData);
      recordAction({ type: 'add', page: currentPageIndex, item: itemData });

      renderCurrentPage();
    }

    function addHighlightBox(container, x, y, scale) {
      const itemData = {
        id: Date.now(),
        type: 'highlight',
        page: currentPageIndex,
        x: x / scale,
        y: y / scale,
        width: 120,
        height: 20
      };

      if (!pageAnnotations[currentPageIndex]) pageAnnotations[currentPageIndex] = [];
      pageAnnotations[currentPageIndex].push(itemData);
      recordAction({ type: 'add', page: currentPageIndex, item: itemData });

      renderCurrentPage();
    }

    function startDrawing(svgLayer, startX, startY, scale) {
      isDrawing = true;
      const points = [{ x: startX / scale, y: startY / scale }];

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('stroke', currentTextColor);
      path.setAttribute('stroke-width', (2 * scale).toString());
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke-linecap', 'round');

      svgLayer.appendChild(path);

      function onPointerMove(e) {
        if (!isDrawing) return;
        const rect = svgLayer.getBoundingClientRect();
        const nx = e.clientX - rect.left;
        const ny = e.clientY - rect.top;

        points.push({ x: nx / scale, y: ny / scale });

        let d = `M ${points[0].x * scale} ${points[0].y * scale}`;
        for (let i = 1; i < points.length; i++) {
          d += ` L ${points[i].x * scale} ${points[i].y * scale}`;
        }
        path.setAttribute('d', d);
      }

      function onPointerUp() {
        if (!isDrawing) return;
        isDrawing = false;
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);

        const itemData = {
          id: Date.now(),
          type: 'draw',
          page: currentPageIndex,
          points: points,
          color: currentTextColor,
          strokeWidth: 2
        };

        if (!pageAnnotations[currentPageIndex]) pageAnnotations[currentPageIndex] = [];
        pageAnnotations[currentPageIndex].push(itemData);
        recordAction({ type: 'add', page: currentPageIndex, item: itemData });
      }

      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
    }

    function restorePageAnnotations(pageNum, container, svgLayer, scale) {
      const items = pageAnnotations[pageNum] || [];
      items.forEach(anim => {
        if (anim.type === 'add-text') {
          const textBox = document.createElement('div');
          textBox.contentEditable = true;
          textBox.className = 'custom-text-box z-30 text-slate-900 shadow-sm selectable-object';
          textBox.setAttribute('data-id', anim.id);
          textBox.style.left = `${anim.x * scale}px`;
          textBox.style.top = `${anim.y * scale}px`;
          textBox.style.fontSize = `${anim.fontSize * scale}px`;
          textBox.style.fontFamily = getCssFontFamily(anim.font);
          textBox.style.color = anim.color;
          textBox.textContent = anim.text;

          textBox.addEventListener('click', (e) => {
            e.stopPropagation();
            if (activeTool === 'select') selectObject(textBox, 'Text Box', textBox.textContent);
          });

          textBox.addEventListener('input', () => {
            anim.text = textBox.textContent;
          });

          makeElementDraggable(textBox, container, scale);
          container.appendChild(textBox);
        } else if (anim.type === 'whiteout') {
          const box = document.createElement('div');
          box.className = 'selectable-object absolute bg-white border border-slate-300 z-20 shadow-sm rounded-xs';
          box.setAttribute('data-id', anim.id);
          box.style.left = `${anim.x * scale}px`;
          box.style.top = `${anim.y * scale}px`;
          box.style.width = `${anim.width * scale}px`;
          box.style.height = `${anim.height * scale}px`;

          box.addEventListener('click', (e) => {
            e.stopPropagation();
            if (activeTool === 'select') selectObject(box, 'Erase Block', 'Whiteout');
          });

          makeElementDraggable(box, container, scale);
          container.appendChild(box);
        } else if (anim.type === 'highlight') {
          const box = document.createElement('div');
          box.className = 'selectable-object absolute bg-amber-300/40 border border-amber-400/60 z-20 rounded-xs';
          box.setAttribute('data-id', anim.id);
          box.style.left = `${anim.x * scale}px`;
          box.style.top = `${anim.y * scale}px`;
          box.style.width = `${anim.width * scale}px`;
          box.style.height = `${anim.height * scale}px`;

          box.addEventListener('click', (e) => {
            e.stopPropagation();
            if (activeTool === 'select') selectObject(box, 'Highlight Block', 'Highlight');
          });

          makeElementDraggable(box, container, scale);
          container.appendChild(box);
        } else if (anim.type === 'draw') {
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('stroke', anim.color);
          path.setAttribute('stroke-width', (anim.strokeWidth * scale).toString());
          path.setAttribute('fill', 'none');
          path.setAttribute('stroke-linecap', 'round');

          let d = `M ${anim.points[0].x * scale} ${anim.points[0].y * scale}`;
          for (let i = 1; i < anim.points.length; i++) {
            d += ` L ${anim.points[i].x * scale} ${anim.points[i].y * scale}`;
          }
          path.setAttribute('d', d);
          svgLayer.appendChild(path);
        }
      });
    }

    function changePage(delta) {
      const targetPage = currentPageIndex + delta;
      if (targetPage >= 1 && targetPage <= totalPages) {
        currentPageIndex = targetPage;
        deselectActiveObject();
        renderCurrentPage();
      }
    }

    function setZoom(newZoom) {
      if (newZoom < 0.5 || newZoom > 2.2) return;
      currentZoom = parseFloat(newZoom.toFixed(2));
      zoomPercentageEl.textContent = `${Math.round(currentZoom * 100)}%`;
      deselectActiveObject();
      renderCurrentPage();
    }

    async function exportModifiedPDF() {
      if (!pdfLibDoc) return;

      try {
        showToast('Saving Document...', 'info');

        const pages = pdfLibDoc.getPages();
        const fontHelvetica = await pdfLibDoc.embedFont(PDFLib.StandardFonts.Helvetica);

        for (let pIdx = 1; pIdx <= totalPages; pIdx++) {
          const pdfPage = pages[pIdx - 1];
          const { width, height } = pdfPage.getSize();

          const jsPage = await pdfjsDoc.getPage(pIdx);
          const baseViewport = jsPage.getViewport({ scale: 1.0 });

          const scaleX = width / baseViewport.width;
          const scaleY = height / baseViewport.height;

          const annotations = pageAnnotations[pIdx] || [];

          for (const anim of annotations) {
            if (anim.type === 'text-edit') {
              const pdfX = anim.x * scaleX;
              const pdfY = height - ((anim.y + anim.height) * scaleY);

              pdfPage.drawRectangle({
                x: pdfX,
                y: pdfY,
                width: anim.width * scaleX,
                height: anim.height * scaleY,
                color: PDFLib.rgb(1, 1, 1)
              });

              if (anim.newText) {
                pdfPage.drawText(anim.newText, {
                  x: pdfX,
                  y: pdfY + (2 * scaleY),
                  size: anim.fontSize * scaleY,
                  font: fontHelvetica,
                  color: PDFLib.rgb(0, 0, 0)
                });
              }
            } else if (anim.type === 'add-text') {
              const pdfX = anim.x * scaleX;
              const pdfY = height - ((anim.y + anim.fontSize) * scaleY);

              pdfPage.drawText(anim.text || '', {
                x: pdfX,
                y: pdfY,
                size: (anim.fontSize || 14) * scaleY,
                font: fontHelvetica,
                color: PDFLib.rgb(0, 0, 0)
              });
            } else if (anim.type === 'whiteout') {
              const pdfX = anim.x * scaleX;
              const pdfY = height - ((anim.y + anim.height) * scaleY);

              pdfPage.drawRectangle({
                x: pdfX,
                y: pdfY,
                width: anim.width * scaleX,
                height: anim.height * scaleY,
                color: PDFLib.rgb(1, 1, 1)
              });
            } else if (anim.type === 'draw') {
              if (anim.points && anim.points.length > 1) {
                for (let i = 0; i < anim.points.length - 1; i++) {
                  const p1 = anim.points[i];
                  const p2 = anim.points[i + 1];

                  pdfPage.drawLine({
                    start: { x: p1.x * scaleX, y: height - (p1.y * scaleY) },
                    end: { x: p2.x * scaleX, y: height - (p2.y * scaleY) },
                    thickness: 2 * scaleX,
                    color: PDFLib.rgb(0, 0, 0)
                  });
                }
              }
            }
          }
        }

        const modifiedPdfBytes = await pdfLibDoc.save();
        const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `HandlePro_${Date.now()}.pdf`;
        link.click();

        showToast('Document Saved Successfully!', 'success');
      } catch (err) {
        console.error(err);
        showToast('Export failed.', 'error');
      }
    }

    async function loadSamplePDF() {
      try {
        const sampleDoc = await PDFLib.PDFDocument.create();
        const page = sampleDoc.addPage([420, 620]);
        const { width, height } = page.getSize();
        const font = await sampleDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
        const fontRegular = await sampleDoc.embedFont(PDFLib.StandardFonts.Helvetica);

        page.drawText('HANDLE PRO V1.0.3', {
          x: 35,
          y: height - 50,
          size: 15,
          font: font,
          color: PDFLib.rgb(0.1, 0.2, 0.6)
        });

        const lines = [
          'Handle your PDF Files with pixel precision.',
          '1. Sharp high-DPI viewport rendering engine.',
          '2. Object selection & drag-and-drop movement.',
          '3. Action-based Undo and Redo operations.',
          '4. Native existing text line editing properties.'
        ];

        let yPos = height - 90;
        lines.forEach(line => {
          page.drawText(line, {
            x: 35,
            y: yPos,
            size: 10,
            font: fontRegular,
            color: PDFLib.rgb(0.2, 0.2, 0.2)
          });
          yPos -= 25;
        });

        const pdfBytes = await sampleDoc.save();
        fileInfo.textContent = 'HandlePro_Sample.pdf';
        loadPDFBytes(pdfBytes);
      } catch (err) {
        console.error(err);
        showToast('Error loading sample.', 'error');
      }
    }

    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');

      toastMsg.textContent = message;

      if (type === 'success') {
        toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
      } else if (type === 'error') {
        toastIcon.className = 'fa-solid fa-circle-exclamation text-rose-400';
      } else {
        toastIcon.className = 'fa-solid fa-circle-info text-brand-400';
      }

      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2200);
    }
  </script>
